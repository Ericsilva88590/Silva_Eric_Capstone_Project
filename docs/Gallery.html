        <p class="intro-text">A collection of the images used across the site.</p>
        <section class="gallery-grid" aria-label="Site image gallery">
            <figure class="gallery-item">
                <img src="Images/RedWolf.jpg" alt="Red wolf" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Red wolf: a critically endangered species native to the southeastern United States.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/GreyWolf.jpg" alt="Grey wolf" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Grey wolf: the most widespread wolf species, known for its adaptability.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/ManedWolf.jpg" alt="Maned wolf" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Maned wolf: a unique South American canid with long legs and reddish fur.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/WolvesFunny.jpg" alt="Playful wolves" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Playful wolves: a group of wolves engaging in social behavior.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/Hunting.jpg" alt="Hunter in a field" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Hunter in a field: representing hunting activities and their impact on wolves.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/WolfHowling.jpg" alt="Wolf howling" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Wolf howling: a wolf communicating with its pack or marking territory.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/Hunter.jpg" alt="Hunter portrait" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Hunter portrait: representing human interaction with wolves, including hunting and conservation.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/Writing.jpg" alt="Writing illustration" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Writing illustration: symbolizing education and advocacy for wolf protection.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/Parks.jpg" alt="Parks landscape" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Parks landscape: protected areas where wolves and other wildlife are conserved.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/WolfProtectionLogo.png" alt="Wolf Protection Logo" loading="lazy" class="zoomable">
                <figcaption>Wolf Protection Logo</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/WolvesWoods.jpg" alt="Wolves in woods" loading="lazy" class="zoomable">

            </figure>
            <figure class="gallery-item">
                <img src="Images/Wolfwithsnow.jpg" alt="Wolf in snow" loading="lazy" class="zoomable">
                <figcaption class="caption-small">Wolf in snow: a wolf adapted to cold environments, blending into its surroundings.</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="Images/SeaWolf.jpg" alt="Sea wolf" loading="lazy" class="zoomable">
